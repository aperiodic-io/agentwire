name: release
# A tag `vX.Y.Z` on main publishes that version: the crate to crates.io, the image to
# ghcr.io/aperiodic-io/deltapack:X.Y.Z (and :latest), a GitHub release with its CHANGELOG entry, a
# Linux binary for each platform (scripts/binary.sh; ci.yml's `binaries` job builds the same) and a
# Homebrew formula; the Python wheels (`deltapack`, `deltapack-cli`) to PyPI, the TypeScript reader
# to npm, and the Go modules' tags (go/vX.Y.Z, go/otelcol/deltapackexporter/vX.Y.Z).
# The tag's commit has passed ci.yml on main; this checks only that the tag and the versions agree
# (scripts/versions.sh). RELEASING.md lists what each registry needs set up once.
#
# Without a tag (a pull request that changes what a release builds, or a run by hand) it is a dry
# run: every job builds what it would publish, as it would, checks it, and publishes nothing
# (`cargo publish --dry-run`, `npm publish --dry-run`, the image unpushed, each wheel installed and
# used, the formula rendered for this commit's source and installed by Homebrew).
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      [.github/workflows/release.yml, Formula/**, python/**, ts/**, go/**, scripts/**, src/**, Dockerfile,
       Cargo.toml, Cargo.lock, rust-toolchain.toml, CHANGELOG.md, README.md, LICENSE]
  workflow_dispatch:
permissions: { contents: read }
env:
  CARGO_TERM_COLOR: always
  # a tag pushed publishes; anything else (a run by hand, even on a tag) is a dry run
  PUBLISH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
  # the release's name in tags and file names: the tag, or `dry-run`
  VERSION: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'dry-run' }}
jobs:
  crate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - if: env.PUBLISH == 'true'
        run: scripts/versions.sh "$VERSION"
      - if: env.PUBLISH != 'true'
        run: scripts/versions.sh
      - run: cargo publish --locked --dry-run

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: deltapack:release
          cache-from: type=gha,scope=image
          cache-to: type=gha,scope=image,mode=max,ignore-error=true
      - run: docker run --rm deltapack:release --version

  # every build above has passed: only now does a tag publish anything, so a failed build leaves
  # nothing half released
  ready:
    needs: [crate, image, changelog, wheels, sdist, npm-pack]
    runs-on: ubuntu-24.04
    steps:
      - run: echo "every package built and checked; publishing ${PUBLISH}"

  publish-crate:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [ready]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: cargo publish --locked
        env: { CARGO_REGISTRY_TOKEN: "${{ secrets.CARGO_REGISTRY_TOKEN }}" }

  publish-image:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [ready]
    runs-on: ubuntu-24.04
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          # :latest for a release, not a pre-release (vX.Y.Z-rc.1)
          tags: |
            ghcr.io/aperiodic-io/deltapack:${{ env.VERSION }}
            ${{ !contains(github.ref_name, '-') && 'ghcr.io/aperiodic-io/deltapack:latest' || '' }}
          cache-from: type=gha,scope=image

  # the release notes: CHANGELOG.md's section for this version, which must say something. A dry run
  # checks the crate's version's section if there is one (a release pull request), else [Unreleased].
  changelog:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: |
          section() { awk -v v="$1" '$0 ~ "^## \\[" v "\\]" { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md; }
          if [ "$PUBLISH" = true ]; then v="${VERSION#v}"; else
            v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
            grep -q "^## \[$v\]" CHANGELOG.md || v=Unreleased
          fi
          section "$v" > notes.md
          grep -q '[^[:space:]]' notes.md || { echo "CHANGELOG.md's section [$v] is missing or empty"; exit 1; }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: notes, path: notes.md }

  github-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [ready]
    runs-on: ubuntu-24.04
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: notes }
      - run: gh release create "$VERSION" --title "$VERSION" --notes-file notes.md
        env: { GH_TOKEN: "${{ github.token }}" }

  # the binary for each platform, attached to the release: for hosts with neither Docker nor Rust
  binaries:
    needs: [ready, github-release]
    if: ${{ !failure() && !cancelled() }}
    strategy:
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
    runs-on: ${{ matrix.os }}
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: scripts/binary.sh ${{ matrix.target }} "$VERSION"
      - run: |
          name="deltapack-$VERSION-${{ matrix.target }}"
          shasum -a 256 -c "$name.tar.gz.sha256"
          tar xzf "$name.tar.gz" && "$name/deltapack" --version
      - if: env.PUBLISH == 'true'
        run: gh release upload --clobber "$VERSION" deltapack-*.tar.gz deltapack-*.tar.gz.sha256
        env: { GH_TOKEN: "${{ github.token }}" }

  # the formula for this release (Formula/deltapack.rb with the tag's source and its sha256),
  # attached to the release; RELEASING.md says how it reaches the tap. A dry run renders it for this
  # commit's source and installs it with the Homebrew the runner image carries.
  homebrew:
    needs: [ready, github-release]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-24.04
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: |
          if [ "$PUBLISH" = true ]; then
            url="https://github.com/aperiodic-io/deltapack/archive/refs/tags/$VERSION.tar.gz"
            curl -fsSL "$url" -o src.tar.gz
          else
            src="$RUNNER_TEMP/deltapack-0.0.0.tar.gz"
            git archive --format=tar.gz --prefix=deltapack-0.0.0/ -o "$src" HEAD
            url="file://$src"
            cp "$src" src.tar.gz
          fi
          sha=$(shasum -a 256 src.tar.gz | cut -d' ' -f1)
          sed "s#^  license \"Apache-2.0\"#  url \"$url\"\n  sha256 \"$sha\"\n  license \"Apache-2.0\"#" Formula/deltapack.rb > deltapack.rb
          grep -q "sha256 \"$sha\"" deltapack.rb
      - if: env.PUBLISH != 'true'
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew tap-new --no-git local/deltapack
          cp deltapack.rb "$(brew --repository local/deltapack)/Formula/deltapack.rb"
          brew install --build-from-source local/deltapack/deltapack
          brew test local/deltapack/deltapack
      - if: env.PUBLISH == 'true'
        run: gh release upload --clobber "$VERSION" deltapack.rb
        env: { GH_TOKEN: "${{ github.token }}" }

  # the Python wheels: the library (abi3, one per platform) and the CLI, each installed and used on
  # the runner it was built for
  wheels:
    strategy:
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64, python: "3.9" }
          - { os: ubuntu-24.04-arm, target: aarch64, python: "3.12" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # the toolchain rust-toolchain.toml names, given to the action so it adds the target to it
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with: { working-directory: python, target: "${{ matrix.target }}", manylinux: auto, rust-toolchain: "1.95.0", args: --release --out ../dist }
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with: { working-directory: python/cli, target: "${{ matrix.target }}", manylinux: auto, rust-toolchain: "1.95.0", args: --release --out ../../dist }
      # abi3 from 3.9: the oldest where an image has it, a newer one on arm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "${{ matrix.python }}" }
      - run: |
          python -m venv "$RUNNER_TEMP/try" && . "$RUNNER_TEMP/try/bin/activate"
          pip install dist/*.whl
          deltapack --version
          printf '{"turn":1}\n{"turn":2}\n' | deltapack log pack "$RUNNER_TEMP/t.dpk"
          python -c "import deltapack, sys; r = deltapack.Reader(sys.argv[1]); assert [b for _, b in r] == [b'{\"turn\":1}', b'{\"turn\":2}']" "$RUNNER_TEMP/t.dpk"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: "wheels-${{ matrix.os }}-${{ matrix.target }}", path: dist }

  # the library's sdist, built and installed from source as pip does where no wheel fits
  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with: { working-directory: python, command: sdist, args: --out ../dist }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - run: |
          python -m venv "$RUNNER_TEMP/try" && . "$RUNNER_TEMP/try/bin/activate"
          pip install dist/*.tar.gz
          python -c "import deltapack; print(deltapack.Reader)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: wheels-sdist, path: dist }

  # PyPI by trusted publishing: no token, the PyPI projects trust this workflow (RELEASING.md)
  pypi:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [ready]
    runs-on: ubuntu-24.04
    environment: pypi
    permissions: { id-token: write }
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { pattern: wheels-*, merge-multiple: true, path: dist }
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  # the npm package as it would be published (its files, its build), published on a tag only
  npm-pack:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "22.19" }
      # the npm that publishes
      - run: npm install -g npm@11.6.2
      - run: npm ci && npm run build && npm publish --dry-run --access public
        working-directory: ts

  npm:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [ready]
    runs-on: ubuntu-24.04
    environment: npm
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "22.19", registry-url: "https://registry.npmjs.org" }
      # trusted publishing (npm 11.5.1 or later): no token, the npm package trusts this workflow
      - run: npm install -g npm@11.6.2
      - run: npm ci && npm run build && npm publish --provenance --access public
        working-directory: ts

  # Go modules are published by their tags: the proxy fetches them from this repository
  go:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [ready]
    runs-on: ubuntu-24.04
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: |
          git tag "go/$VERSION" "$GITHUB_SHA"
          git tag "go/otelcol/deltapackexporter/$VERSION" "$GITHUB_SHA"
          git push origin "go/$VERSION" "go/otelcol/deltapackexporter/$VERSION"
