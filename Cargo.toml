[package]
name = "agentwire"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
description = "AWD1: send each LLM request as a delta against the previous one. Codec, client, tower server layer and proxies."
repository = "https://github.com/aperiodic-io/agentwire"
readme = "README.md"
keywords = ["compression", "llm", "delta", "http", "zstd"]
categories = ["compression", "network-programming", "web-programming::http-server"]
include = ["/src", "/README.md", "/SPEC.md", "/LICENSE"]

[features]
default = ["server"]
# the tower layer that decodes AWD1 requests (src/server.rs)
server = ["dep:http", "dep:http-body", "dep:http-body-util", "dep:tower-layer", "dep:tower-service"]
# the `agentwire` binary: the server layer as a reverse proxy, and a local client proxy
proxy = [
  "server",
  "dep:clap",
  "dep:futures-util",
  "dep:hyper",
  "dep:hyper-util",
  "dep:reqwest",
  "dep:tokio",
  "dep:tracing",
  "dep:tracing-subscriber",
]

[dependencies]
bytes = "1"
sha2 = "0.10"
zstd-safe = { version = "7", default-features = false, features = ["std"] }

http = { version = "1", optional = true }
http-body = { version = "1", optional = true }
http-body-util = { version = "0.1", optional = true }
tower-layer = { version = "0.3", optional = true }
tower-service = { version = "0.3", optional = true }

clap = { version = "4", features = ["derive", "env"], optional = true }
futures-util = { version = "0.3", default-features = false, optional = true }
hyper = { version = "1", features = ["server", "http1", "http2"], optional = true }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "server-graceful", "service"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http2"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"], optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"], optional = true }

[dev-dependencies]
cucumber = "0.23"
futures-util = { version = "0.3", default-features = false }
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "service"] }
proptest = "1"
reqwest = { version = "0.12", default-features = false, features = ["stream"] }
tokio = { version = "1", features = ["full"] }
tower-layer = "0.3"
tower-service = "0.3"

[[bin]]
name = "agentwire"
required-features = ["proxy"]

[[test]]
name = "integration"
required-features = ["server"]

# the proxies run as real processes against a recording upstream (tests/acceptance/)
[[test]]
name = "acceptance"
path = "tests/acceptance/main.rs"
harness = false
required-features = ["proxy"]

[lints.rust]
unsafe_code = "forbid"
# Kani proofs: `#[cfg(kani)] mod proofs` beside the code they prove (`cargo kani`)
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[lints.clippy]
all = { level = "deny", priority = -1 }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
# zstd's C code and sha2 at -O0 make the round-trip properties slow
opt-level = 2

# cargo-mutants (.cargo/mutants.toml): rebuilt once per mutant, so no debug info
[profile.mutants]
inherits = "dev"
debug = false

[profile.release]
lto = "fat"
codegen-units = 1
