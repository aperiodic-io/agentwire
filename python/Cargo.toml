[package]
name = "deltapack-python"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
description = "Python bindings for DPK1: LLM request logs and trace spans stored as deltas."
repository = "https://github.com/aperiodic-io/deltapack"
publish = false

[lib]
# the Python module is `deltapack`; the Rust crate it wraps is renamed `dpk` here
name = "deltapack"
crate-type = ["cdylib"]

[dependencies]
dpk = { package = "deltapack", path = "..", default-features = false }
bytes = "1"
# one wheel for CPython 3.9 and later
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py39"] }

[lints.clippy]
all = { level = "deny", priority = -1 }

# a workspace of its own: the crate's tests, coverage and mutants never build it
[workspace]
