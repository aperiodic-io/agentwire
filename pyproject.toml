[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "agentwire-poc"
version = "0.1.0"
description = "Versioned Zstd agent transport and explicitly lossy agent-context reduction"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agentwire = "agentwire.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
