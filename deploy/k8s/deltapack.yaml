# deltapack collect as a StatefulSet: one replica, its record directory on a persistent volume
# (deltapack locks it: one process per directory). Exporters in the cluster send to
# http://deltapack:4318 (OTLP/HTTP) or deltapack:4317 (OTLP/gRPC). Set --forward to keep your
# current backend; see the README's "Proxy reference" for every flag.
#   kubectl apply -f deploy/k8s/deltapack.yaml
#   kubectl exec deltapack-0 -- sh -c 'deltapack log stats /data/*.dpk'
apiVersion: v1
kind: Service
metadata:
  name: deltapack
  labels: { app: deltapack }
spec:
  selector: { app: deltapack }
  ports:
    - { name: otlp-http, port: 4318, targetPort: 4318 }
    - { name: otlp-grpc, port: 4317, targetPort: 4317 }
    - { name: metrics, port: 9464, targetPort: 9464 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: deltapack
spec:
  serviceName: deltapack
  replicas: 1
  selector:
    matchLabels: { app: deltapack }
  template:
    metadata:
      labels: { app: deltapack }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9464"
    spec:
      # it calls no Kubernetes API
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: { type: RuntimeDefault }
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        runAsNonRoot: true
      containers:
        - name: deltapack
          # pin a release (or its digest) in production
          image: ghcr.io/aperiodic-io/deltapack:latest
          args:
            - collect
            - --record-dir=/data
            - --listen=0.0.0.0:4318,0.0.0.0:4317
            - --metrics=0.0.0.0:9464
            - --keep-bytes=8000000000 # of the 10Gi volume
            # - --forward=https://your-backend.example.com
          ports:
            - { name: otlp-http, containerPort: 4318 }
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: metrics, containerPort: 9464 }
          readinessProbe:
            tcpSocket: { port: 4318 }
            periodSeconds: 5
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { memory: 2Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /data }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: 10Gi }
